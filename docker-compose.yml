services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # Values come from the .env file in the project root (the same one the app reads).
    # They are only applied the first time the volume is initialised.
    environment:
      # Admin (schema owner) role, used by migrations
      POSTGRES_USER: ${DB_ADMIN_USERNAME:?Set DB_ADMIN_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env}
      # Least-privileged role the app connects as (created by db/init/01-app-role.sh)
      APP_DB_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # postgres 18+ keeps its data in a versioned subdirectory of /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
      # Runs only when the data volume is first initialised
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
